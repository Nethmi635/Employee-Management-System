<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - EMS</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <style>
        body {
            background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
        }

        .login-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            padding: 40px;
            width: 100%;
            max-width: 400px;
            position: relative;
            overflow: hidden;
        }

        .login-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #fbbf24, #f59e0b);
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-header h1 {
            color: #333;
            font-size: 28px;
            font-weight: 600;
            margin: 0 0 10px 0;
        }

        .login-header p {
            color: #6b7280;
            font-size: 14px;
            margin: 0;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: #333;
            font-weight: 500;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .form-control {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }

        .form-control:focus {
            outline: none;
            border-color: #fbbf24;
            box-shadow: 0 0 0 3px rgba(251, 191, 36, 0.1);
        }

        .btn-login {
            width: 100%;
            background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(251, 191, 36, 0.3);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .error-message {
            background: #fee;
            color: #c33;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #c33;
            font-size: 14px;
        }

        .demo-credentials {
            background: #fffbea;
            border-radius: 10px;
            padding: 20px;
            margin-top: 20px;
            border-left: 4px solid #f59e0b;
        }

        .demo-credentials h3 {
            color: #333;
            font-size: 16px;
            margin: 0 0 15px 0;
            font-weight: 600;
        }

        .credential-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid #e5e7eb;
        }

        .credential-item:last-child {
            border-bottom: none;
        }

        .credential-role {
            font-weight: 600;
            color: #f59e0b;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .credential-details {
            font-size: 13px;
            color: #6b7280;
        }

        .back-to-home {
            text-align: center;
            margin-top: 20px;
        }

        .back-to-home a {
            color: #f59e0b;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
        }

        .back-to-home a:hover {
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 30px 20px;
                margin: 10px;
            }

            .login-header h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
<div class="login-container">
    <div class="login-header">
        <h1>🔐 EMS Login</h1>
        <p>Employee Management System</p>
    </div>

    <!-- Error Message -->
    <div th:if="${param.error}" class="error-message">
        ❌ Invalid username or password. Please try again.
    </div>

    <!-- Logout Message -->
    <div th:if="${param.logout}" class="error-message" style="background: #efe; color: #363; border-left-color: #363;">
        ✅ You have been logged out successfully.
    </div>

    <!-- Login Form -->
    <form th:action="@{/login}" method="post">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" class="form-control"
                   placeholder="Enter your username" required autofocus>
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" class="form-control"
                   placeholder="Enter your password" required>
        </div>

        <button type="submit" class="btn-login">
            🚀 Sign In
        </button>
    </form>

    <!-- Demo Credentials -->
    <div class="demo-credentials">
        <h3>📋 Demo Credentials</h3>

        <div class="credential-item">
            <div class="credential-role">Admin</div>
            <div class="credential-details">admin / admin123</div>
        </div>

        <div class="credential-item">
            <div class="credential-role">HR</div>
            <div class="credential-details">sadeni / sadeni123</div>
        </div>

        <div class="credential-item">
            <div class="credential-role">Manager</div>
            <div class="credential-details">nethmi / nethmi123</div>
        </div>

        <div class="credential-item">
            <div class="credential-role">Employee</div>
            <div class="credential-details">tharushi / tharushi123</div>
        </div>
    </div>

    <div class="back-to-home">
        <a th:href="@{/}">← Back to Home</a>
    </div>
</div>

<script>
    // Add some interactive effects
    document.addEventListener('DOMContentLoaded', function() {
        const inputs = document.querySelectorAll('.form-control');
        inputs.forEach(input => {
            input.addEventListener('focus', function() {
                this.parentElement.style.transform = 'scale(1.02)';
            });

            input.addEventListener('blur', function() {
                this.parentElement.style.transform = 'scale(1)';
            });
        });

        // Auto-fill demo credentials on click
        const credentialItems = document.querySelectorAll('.credential-item');
        credentialItems.forEach(item => {
            item.addEventListener('click', function() {
                const details = this.querySelector('.credential-details').textContent;
                const [username, password] = details.split(' / ');

                document.getElementById('username').value = username;
                document.getElementById('password').value = password;

                // Add visual feedback
                this.style.background = '#fef3c7';
                setTimeout(() => {
                    this.style.background = '';
                }, 1000);
            });
        });
    });
</script>
</body>
</html>

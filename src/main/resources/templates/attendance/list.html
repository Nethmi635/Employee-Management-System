<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Attendance</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}" href="/css/styles.css"/>
</head>
<body>
<div class="container">
<div class="card">
<div class="card-header">Attendance</div>
<div class="card-body">
<div class="stack">
    <a class="btn secondary" href="/">Back</a>
</div>
<div class="spacer"></div>
<form class="toolbar" method="get">
    <select name="employeeId">
        <option th:selected="${employeeId == null}" value="">All employees</option>
        <option th:each="e : ${employees}" th:value="${e.id}" th:text="${e.firstName + ' ' + e.lastName}" th:selected="${employeeId == e.id}"></option>
    </select>
    <input type="submit" value="Filter">
    </form>

<form class="toolbar" method="post" action="/attendance/checkin">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
    <select name="employeeId" required>
        <option th:each="e : ${employees}" th:value="${e.id}" th:text="${e.firstName + ' ' + e.lastName}"></option>
    </select>
    <input type="submit" value="Check-In">
    </form>

<h3>Add Attendance Record</h3>
<div class="stack">
    <a class="btn" href="/attendance/new">Add New Attendance</a>
</div>
<div class="spacer"></div>

<table>
    <thead>
        <tr>
            <th>ID</th>
            <th>Employee</th>
            <th>Date</th>
            <th>Check-In</th>
            <th>Check-Out</th>
            <th>Hours</th>
            <th>Overtime</th>
            <th>Status</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody>
    <tr th:each="r: ${records}">
        <td th:text="${r.id}">1</td>
        <td th:text="${r.employee.firstName + ' ' + r.employee.lastName}">John Doe</td>
        <td th:text="${r.date}">2025-01-01</td>
        <td th:text="${r.checkInAt != null ? #temporals.format(r.checkInAt, 'HH:mm') : '-'}">09:00</td>
        <td th:text="${r.checkOutAt != null ? #temporals.format(r.checkOutAt, 'HH:mm') : '-'}">17:00</td>
        <td th:text="${r.isComplete() ? #numbers.formatDecimal(r.workingHours, 1, 1) + 'h' : '-'}">8.0h</td>
        <td>
            <span th:if="${r.hasOvertime()}" 
                  class="badge" 
                  style="background: #fef3c7; color: #92400e;"
                  th:text="${'+' + #numbers.formatDecimal(r.overtimeHours, 1, 1) + 'h'}">2.5h</span>
            <span th:unless="${r.hasOvertime()}" class="muted">-</span>
        </td>
        <td>
            <span th:if="${r.isPresent() and r.isComplete()}" 
                  class="badge" 
                  style="background: #d1fae5; color: #065f46;">Present</span>
            <span th:if="${r.isPartial()}" 
                  class="badge" 
                  style="background: #fef3c7; color: #92400e;">Partial</span>
            <span th:if="${r.isAbsent()}" 
                  class="badge" 
                  style="background: #fee2e2; color: #991b1b;">Absent</span>
        </td>
        <td>
            <div class="stack">
                <form th:if="${r.checkOutAt == null}" th:action="@{'/attendance/checkout/' + ${r.id}}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    <input type="submit" value="Check-Out" class="btn secondary">
                </form>
                <a class="btn" th:href="@{'/attendance/' + ${r.id} + '/edit'}">Edit</a>
                <form th:action="@{'/attendance/' + ${r.id} + '/delete'}" method="post" style="display:inline;">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    <input type="submit" value="Delete" class="btn danger">
                </form>
            </div>
        </td>
    </tr>
    </tbody>
</table>
</div>
</div>
</div>
</body>
</html>

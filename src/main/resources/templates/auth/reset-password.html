<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Reset Password</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}" href="/css/styles.css"/>
</head>
<body>
<header class="site-header">
    <div class="container">
        <div class="brand">SLIIT EMS</div>
        <nav class="nav">
            <a href="/">Dashboard</a>
            <a href="/login">Login</a>
        </nav>
    </div>
</header>

<main class="container">
<div class="card">
<div class="card-header">Reset Password</div>
<div class="card-body">

<div th:if="${success}" class="alert" style="background: #d1fae5; color: #065f46; padding: 12px; border-radius: 4px; margin-bottom: 16px;">
    <span th:text="${success}">Success message</span>
</div>

<div th:if="${error}" class="alert" style="background: #fee2e2; color: #991b1b; padding: 12px; border-radius: 4px; margin-bottom: 16px;">
    <span th:text="${error}">Error message</span>
</div>

<form th:action="@{/auth/reset-password}" method="post">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
    <input type="hidden" name="token" th:value="${token}">
    
    <div class="form-row">
        <div class="form-col">
            <label>New Password</label>
            <input type="password" name="password" required placeholder="Enter new password">
        </div>
    </div>
    
    <div class="form-row">
        <div class="form-col">
            <label>Confirm Password</label>
            <input type="password" name="confirmPassword" required placeholder="Confirm new password">
        </div>
    </div>
    
    <div class="spacer"></div>
    
    <input type="submit" value="Reset Password" class="btn">
    <a href="/login" class="btn secondary">Back to Login</a>
</form>

</div>
</div>
</div>
</main>
</body>
</html>

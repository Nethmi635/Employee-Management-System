<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>New Employee</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}" href="/css/styles.css"/>
</head>
<body>
<div class="container">
    <div class="card">
        <div class="card-header">Create Employee</div>
        <div class="card-body">
            <a class="btn secondary" href="/employee">Back to list</a>
            <div class="spacer"></div>
            
            <!-- Display validation errors -->
            <div th:if="${validationErrors != null and !validationErrors.empty}" class="alert alert-error">
                <h4>Please correct the following errors:</h4>
                <ul>
                    <li th:each="error : ${validationErrors}" th:text="${error}"></li>
                </ul>
            </div>
            
            <!-- Display general error -->
            <div th:if="${error != null}" class="alert alert-error">
                <span th:text="${error}"></span>
            </div>
            
            <h3>Full-Time</h3>
            <form th:action="@{/employee/new/fulltime}" method="post" th:object="${fullTimeEmployee}">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <div class="form-row">
                    <div class="form-col">
                        <label>First Name</label>
                        <input th:field="*{firstName}" placeholder="First Name" required>
                        <div th:if="${#fields.hasErrors('firstName')}" class="field-error" th:errors="*{firstName}"></div>
                    </div>
                    <div class="form-col">
                        <label>Last Name</label>
                        <input th:field="*{lastName}" placeholder="Last Name" required>
                        <div th:if="${#fields.hasErrors('lastName')}" class="field-error" th:errors="*{lastName}"></div>
                    </div>
                    <div class="form-col">
                        <label>Email</label>
                        <input th:field="*{email}" placeholder="Email" type="email" required>
                        <div th:if="${#fields.hasErrors('email')}" class="field-error" th:errors="*{email}"></div>
                    </div>
                    <div class="form-col">
                        <label>Phone</label>
                        <input th:field="*{phone}" placeholder="Phone (e.g., +1-555-123-4567)" required>
                        <div th:if="${#fields.hasErrors('phone')}" class="field-error" th:errors="*{phone}"></div>
                    </div>
                    <div class="form-col">
                        <label>Department</label>
                        <select th:field="*{department}" required>
                            <option value="">Select Department</option>
                            <option value="Human Resources">Human Resources</option>
                            <option value="Information Technology">Information Technology</option>
                            <option value="Finance">Finance</option>
                            <option value="Marketing">Marketing</option>
                            <option value="Sales">Sales</option>
                            <option value="Operations">Operations</option>
                            <option value="Customer Service">Customer Service</option>
                            <option value="Legal">Legal</option>
                            <option value="Administration">Administration</option>
                            <option value="Engineering">Engineering</option>
                            <option value="Research and Development">Research and Development</option>
                            <option value="Quality Assurance">Quality Assurance</option>
                        </select>
                        <div th:if="${#fields.hasErrors('department')}" class="field-error" th:errors="*{department}"></div>
                    </div>
                    <div class="form-col">
                        <label>Job Title</label>
                        <input th:field="*{jobTitle}" placeholder="Job Title" required>
                        <div th:if="${#fields.hasErrors('jobTitle')}" class="field-error" th:errors="*{jobTitle}"></div>
                    </div>
                    <div class="form-col">
                        <label>Annual Salary</label>
                        <input th:field="*{annualSalary}" placeholder="Annual Salary" type="number" step="0.01" min="20000" max="1000000">
                        <div th:if="${#fields.hasErrors('annualSalary')}" class="field-error" th:errors="*{annualSalary}"></div>
                    </div>
                </div>
                <div class="spacer"></div>
                <input type="submit" value="Create Full-Time">
            </form>
            <div class="spacer"></div>
            <h3>Contract</h3>
            <form th:action="@{/employee/new/contract}" method="post" th:object="${contractEmployee}">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <div class="form-row">
                    <div class="form-col">
                        <label>First Name</label>
                        <input th:field="*{firstName}" placeholder="First Name" required>
                        <div th:if="${#fields.hasErrors('firstName')}" class="field-error" th:errors="*{firstName}"></div>
                    </div>
                    <div class="form-col">
                        <label>Last Name</label>
                        <input th:field="*{lastName}" placeholder="Last Name" required>
                        <div th:if="${#fields.hasErrors('lastName')}" class="field-error" th:errors="*{lastName}"></div>
                    </div>
                    <div class="form-col">
                        <label>Email</label>
                        <input th:field="*{email}" placeholder="Email" type="email" required>
                        <div th:if="${#fields.hasErrors('email')}" class="field-error" th:errors="*{email}"></div>
                    </div>
                    <div class="form-col">
                        <label>Phone</label>
                        <input th:field="*{phone}" placeholder="Phone (e.g., +1-555-123-4567)" required>
                        <div th:if="${#fields.hasErrors('phone')}" class="field-error" th:errors="*{phone}"></div>
                    </div>
                    <div class="form-col">
                        <label>Department</label>
                        <select th:field="*{department}" required>
                            <option value="">Select Department</option>
                            <option value="Human Resources">Human Resources</option>
                            <option value="Information Technology">Information Technology</option>
                            <option value="Finance">Finance</option>
                            <option value="Marketing">Marketing</option>
                            <option value="Sales">Sales</option>
                            <option value="Operations">Operations</option>
                            <option value="Customer Service">Customer Service</option>
                            <option value="Legal">Legal</option>
                            <option value="Administration">Administration</option>
                            <option value="Engineering">Engineering</option>
                            <option value="Research and Development">Research and Development</option>
                            <option value="Quality Assurance">Quality Assurance</option>
                        </select>
                        <div th:if="${#fields.hasErrors('department')}" class="field-error" th:errors="*{department}"></div>
                    </div>
                    <div class="form-col">
                        <label>Job Title</label>
                        <input th:field="*{jobTitle}" placeholder="Job Title" required>
                        <div th:if="${#fields.hasErrors('jobTitle')}" class="field-error" th:errors="*{jobTitle}"></div>
                    </div>
                    <div class="form-col">
                        <label>Hourly Rate</label>
                        <input th:field="*{hourlyRate}" placeholder="Hourly Rate" type="number" step="0.01" min="10" max="500">
                        <div th:if="${#fields.hasErrors('hourlyRate')}" class="field-error" th:errors="*{hourlyRate}"></div>
                    </div>
                </div>
                <div class="spacer"></div>
                <input type="submit" value="Create Contract">
            </form>
        </div>
    </div>
    </div>

</body>
</html>

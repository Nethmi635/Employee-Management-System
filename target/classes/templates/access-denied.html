<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Access Denied</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}" href="/css/styles.css"/>
</head>
<body>
<div class="container">
    <div class="card">
        <div class="card-header">Access denied</div>
        <div class="card-body">
            <h2>Permission required</h2>
            <p>You don’t have permission to access this page.</p>
            <p>Select specific permissions for this user. These permissions will override the default permissions for the user's role.</p>
            <div class="stack">
                <a class="btn" href="/">Go to Dashboard</a>
                <a class="btn secondary" href="/admin/users">Back to Users</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>

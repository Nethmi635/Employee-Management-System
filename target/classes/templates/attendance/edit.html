<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Attendance</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}" href="/css/styles.css"/>
</head>
<body>
<div class="container">
<div class="card">
<div class="card-header">Edit Attendance</div>
<div class="card-body">
    <a class="btn secondary" href="/attendance">Back</a>
    <div class="spacer"></div>
    <form th:action="@{'/attendance/' + ${record.id} + '/edit'}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        <div class="form-row">
            <div class="form-col">
                <label>Date</label>
                <input type="date" name="date" th:value="${record.date}" required>
            </div>
            <div class="form-col">
                <label>Check-In</label>
                <input type="datetime-local" name="checkInAt" th:value="${record.checkInAt}" placeholder="yyyy-MM-ddTHH:mm">
            </div>
            <div class="form-col">
                <label>Check-Out</label>
                <input type="datetime-local" name="checkOutAt" th:value="${record.checkOutAt}" placeholder="yyyy-MM-ddTHH:mm">
            </div>
        </div>
        <div class="spacer"></div>
        <input type="submit" value="Save">
    </form>
</div>
</div>
</div>
</body>
</html>

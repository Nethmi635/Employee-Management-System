<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Forgot Password</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}" href="/css/styles.css"/>
</head>
<body>
<header class="site-header">
    <div class="container">
        <div class="brand">SLIIT EMS</div>
        <nav class="nav">
            <a href="/">Dashboard</a>
            <a href="/login">Login</a>
        </nav>
    </div>
</header>

<main class="container">
<div class="card">
<div class="card-header">Forgot Password</div>
<div class="card-body">

<div th:if="${success}" class="alert" style="background: #d1fae5; color: #065f46; padding: 12px; border-radius: 4px; margin-bottom: 16px;">
    <span th:text="${success}">Success message</span>
</div>

<div th:if="${error}" class="alert" style="background: #fee2e2; color: #991b1b; padding: 12px; border-radius: 4px; margin-bottom: 16px;">
    <span th:text="${error}">Error message</span>
</div>

<form th:action="@{/auth/forgot-password}" method="post">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
    
    <div class="form-row">
        <div class="form-col">
            <label>Username</label>
            <input type="text" name="username" required placeholder="Enter your username">
        </div>
    </div>
    
    <div class="spacer"></div>
    
    <input type="submit" value="Send Reset Link" class="btn">
    <a href="/login" class="btn secondary">Back to Login</a>
</form>

<div th:if="${token}" class="card" style="background: #f3f4f6; margin-top: 20px;">
    <div class="card-header">Development Mode</div>
    <div class="card-body">
        <p>In development mode, the reset token is: <strong th:text="${token}">token</strong></p>
        <p>Use this link to reset your password: <a th:href="@{'/auth/reset-password?token=' + ${token}}" th:text="@{'/auth/reset-password?token=' + ${token}}">Reset Password</a></p>
    </div>
</div>

</div>
</div>
</div>
</main>
</body>
</html>
